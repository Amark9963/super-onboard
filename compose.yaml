name: super-onboard
x-backend: &backend
  build: ./backend
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-onboard}:${POSTGRES_PASSWORD:-local-only}@postgres:5432/${POSTGRES_DB:-onboard}
    AI_PROVIDER: mock
    # Live extraction is opt-in: leave AI_API_KEY empty to keep only the SIMULATED mock available.
    AI_API_KEY: ${AI_API_KEY:-}
    AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
    AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    SMTP_HOST: mailpit
    SMTP_PORT: 1025
    SMTP_FROM: ${SMTP_FROM:-Implementation team <onboard@example.invalid>}
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    S3_ENDPOINT: http://minio:9000
    S3_BUCKET: onboard-private
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:-onboard-local}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local-storage-only}
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-onboard}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    build:
      context: ./infra/minio
      target: server
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-onboard-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-storage-only}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
  storage-init:
    build:
      context: ./infra/minio
      target: client
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-onboard-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-storage-only}
    entrypoint: ["/bin/sh", "-ec", "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; mc mb --ignore-existing local/onboard-private; mc anonymous set none local/onboard-private"]
  mailpit:
    image: axllent/mailpit:v1.24.1
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  migrate:
    <<: *backend
    command: alembic upgrade head
    depends_on:
      postgres: { condition: service_healthy }
  backend:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
  worker:
    <<: *backend
    command: python -m app.worker
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "from app.db import engine; from sqlalchemy import text; c=engine.connect(); assert c.execute(text(\"SELECT 1 FROM worker_heartbeats WHERE seen_at > CURRENT_TIMESTAMP - INTERVAL '30 seconds'\")).first()"]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
  minio-data:
