name: M1 checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: onboard
          POSTGRES_PASSWORD: local-only
          POSTGRES_DB: onboard_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.lock && pip install --no-deps -e '.[dev]'
        working-directory: backend
      - run: ruff check . && ruff format --check . && pytest -q
        working-directory: backend
      - run: pytest -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://onboard:local-only@localhost:5432/onboard_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run format:check && npm run build
      - run: |
          npm start > /tmp/super-onboard-web.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && break; sleep 1; done
          FRONTEND_URL=http://localhost:3000 npm test
